name: Aggiorna dati treni

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_trains.py"
      - ".github/workflows/update-trains.yml"
  schedule:
    # Fallback di sicurezza. Il processo principale si auto-rinnova.
    - cron: "17 */2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: train-live-daemon
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mantieni dati live ogni 5 minuti
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Circa 5h40m: il job non dipende dal cron per ogni singolo aggiornamento.
          # Prima di ogni ciclo riallinea main, aggiorna i dati e pubblica l'heartbeat.
          for cycle in $(seq 1 69); do
            echo "=== Ciclo $cycle/69 · $(date -u +%FT%TZ) ==="

            git fetch origin main
            git reset --hard origin/main

            if python scripts/update_trains.py; then
              if ! git diff --quiet -- data/trains.json; then
                git add data/trains.json
                git commit -m "Aggiorna dati live treni"

                pushed=0
                for attempt in 1 2 3; do
                  if git push origin HEAD:main; then
                    pushed=1
                    break
                  fi
                  echo "Push non riuscito; riallineo e ritento ($attempt/3)"
                  git pull --rebase origin main || true
                  sleep 5
                done
                if [ "$pushed" -ne 1 ]; then
                  echo "ATTENZIONE: aggiornamento non pubblicato in questo ciclo."
                fi
              else
                echo "Nessuna differenza da pubblicare."
              fi
            else
              echo "ATTENZIONE: lettura ViaggiaTreno non riuscita; ritento al ciclo successivo."
            fi

            # L'ultimo ciclo non dorme: passa subito al rinnovo del workflow.
            if [ "$cycle" -lt 69 ]; then
              sleep 300
            fi
          done

      - name: Avvia il processo successivo
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Rinnovo automatico del monitor live..."
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-trains.yml/dispatches"             -d '{"ref":"main"}'
