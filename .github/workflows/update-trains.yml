name: Aggiorna dati treni

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_trains.py"
      - ".github/workflows/update-trains.yml"
  schedule:
    # Avvia una sessione ogni 30 minuti; dentro la sessione il controllo
    # ViaggiaTreno viene eseguito ogni 5 minuti reali.
    - cron: "2,32 4-8,15-20 * * *"

permissions:
  contents: write

concurrency:
  group: update-trains
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controllo live ogni 5 minuti
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5 6; do
            echo "Controllo $i/6 - $(date -u)"
            python scripts/update_trains.py

            if ! git diff --quiet -- data/trains.json; then
              git add data/trains.json
              git commit -m "Aggiorna dati live treni"
              git push
            else
              echo "Nessuna modifica da pubblicare."
            fi

            if [ "$i" -lt 6 ]; then
              sleep 300
            fi
          done
