name: Aggiorna dati treni

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_trains.py"
      - ".github/workflows/update-trains.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: train-live-v3
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ferma eventuali vecchi monitor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          curl -sS -L             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100"           | jq -r --argjson current "$CURRENT_RUN" '
              .workflow_runs[]
              | select(.name == "Aggiorna dati treni")
              | select(.status == "in_progress" or .status == "queued" or .status == "pending")
              | select(.id != $current)
              | .id
            '           | while read -r RUN_ID; do
              [ -z "$RUN_ID" ] && continue
              echo "Cancello vecchio run $RUN_ID"
              curl -sS -L -X POST                 -H "Accept: application/vnd.github+json"                 -H "Authorization: Bearer $GH_TOKEN"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/cancel" || true
            done

      - name: Checkout ramo dati live
        uses: actions/checkout@v4
        with:
          ref: live-data
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna i dati live ogni 5 minuti
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for cycle in $(seq 1 69); do
            git fetch origin live-data
            git reset --hard origin/live-data

            python scripts/update_trains.py || true

            if ! git diff --quiet -- data/trains.json; then
              git add data/trains.json
              git commit -m "Aggiorna dati live treni"

              pushed=0
              for attempt in 1 2 3; do
                if git push origin HEAD:live-data; then
                  pushed=1
                  break
                fi
                echo "Conflitto live-data: riallineo e ritento ($attempt/3)"
                git fetch origin live-data
                git reset --hard origin/live-data
                python scripts/update_trains.py || true
                git add data/trains.json
                git commit -m "Aggiorna dati live treni" || true
                sleep 3
              done
              if [ "$pushed" -ne 1 ]; then
                echo "Aggiornamento saltato; ritento al ciclo successivo."
              fi
            fi

            if [ "$cycle" -lt 69 ]; then
              sleep 300
            fi
          done

      - name: Rinnova monitor
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-trains.yml/dispatches"             -d '{"ref":"main"}'
