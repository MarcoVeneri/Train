name: Aggiorna dati treni

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_trains.py"
      - ".github/workflows/update-trains.yml"
  schedule:
    # Vecchie finestre pendolarismo: controllo ogni 5 minuti, 7 giorni su 7.
    # Le ore sono UTC; lo script decide la finestra reale usando Europe/Rome.
    - cron: "*/5 4-8,15-20 * * *"
    # Reset giornaliero: entrambi gli orari coprono mezzanotte italiana con CET/CEST.
    - cron: "0 22,23 * * *"

permissions:
  contents: write

concurrency:
  group: train-live-current
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout ramo dati live
        uses: actions/checkout@v4
        with:
          ref: live-data
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna dati
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main live-data
            git reset --hard origin/live-data
            git show origin/main:scripts/update_trains.py > /tmp/update_trains.py
            cp /tmp/update_trains.py scripts/update_trains.py

            python scripts/update_trains.py || true

            if git diff --quiet -- data/trains.json; then
              echo "Nessuna modifica da pubblicare."
              exit 0
            fi

            git add data/trains.json
            git commit -m "Aggiorna dati live treni" || true
            if git push origin HEAD:live-data; then
              exit 0
            fi

            echo "Conflitto live-data: ritento ($attempt/3)"
            sleep 3
          done

          echo "Impossibile pubblicare l'aggiornamento."
          exit 1
