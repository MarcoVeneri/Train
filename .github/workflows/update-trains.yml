name: Aggiorna dati treni

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_trains.py"
      - ".github/workflows/update-trains.yml"
  schedule:
    # Solo paracadute giornaliero: il monitor si rinnova da solo.
    - cron: "17 4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: train-live-v2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ferma il vecchio monitor difettoso
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN_ID in 35614495094 35615060969; do
            curl -sS -L -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/cancel" || true
          done

      - name: Checkout ramo dati live
        uses: actions/checkout@v4
        with:
          ref: live-data
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna i dati live ogni 5 minuti
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for cycle in $(seq 1 69); do
            git fetch origin live-data
            git reset --hard origin/live-data

            python scripts/update_trains.py || true

            if ! git diff --quiet -- data/trains.json; then
              git add data/trains.json
              git commit -m "Aggiorna dati live treni"
              git push origin HEAD:live-data
            fi

            if [ "$cycle" -lt 69 ]; then sleep 300; fi
          done

      - name: Rinnova monitor
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-trains.yml/dispatches"             -d '{"ref":"main"}'
