name: Aggiorna dati treni

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_trains.py"
      - ".github/workflows/update-trains.yml"
  schedule:
    # Quattro finestre al giorno, tutti i giorni: sabato e domenica inclusi.
    # Ogni run resta attivo per circa 5h45 e aggiorna ogni 5 minuti.
    - cron: "7 0,6,12,18 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: train-live-current
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Ferma vecchio monitor legacy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Il vecchio run 121 usava lo script copiato sul ramo live-data e poteva
          # continuare a sovrascrivere i dati nuovi. Lo fermiamo esplicitamente.
          curl -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/38177633812/cancel" || true

      - name: Checkout ramo dati live
        uses: actions/checkout@v4
        with:
          ref: live-data
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna i dati live ogni 5 minuti
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main live-data

          for cycle in $(seq 1 69); do
            git fetch origin main live-data
            git reset --hard origin/live-data

            # Usa sempre il monitor più recente dal ramo main.
            git show origin/main:scripts/update_trains.py > /tmp/update_trains.py
            cp /tmp/update_trains.py scripts/update_trains.py

            python scripts/update_trains.py || true

            if ! git diff --quiet -- data/trains.json; then
              git add data/trains.json
              git commit -m "Aggiorna dati live treni"

              pushed=0
              for attempt in 1 2 3; do
                if git push origin HEAD:live-data; then
                  pushed=1
                  break
                fi
                echo "Conflitto live-data: riallineo e ritento ($attempt/3)"
                git fetch origin main live-data
                git reset --hard origin/live-data
                git show origin/main:scripts/update_trains.py > /tmp/update_trains.py
                cp /tmp/update_trains.py scripts/update_trains.py
                python scripts/update_trains.py || true
                git add data/trains.json
                git commit -m "Aggiorna dati live treni" || true
                sleep 3
              done

              if [ "$pushed" -ne 1 ]; then
                echo "Aggiornamento saltato; ritento al ciclo successivo."
              fi
            fi

            if [ "$cycle" -lt 69 ]; then
              sleep 300
            fi
          done
