name: Aggiorna dati treni

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_trains.py"
      - ".github/workflows/update-trains.yml"
  schedule:
    # Sempre attivo: un controllo ogni 5 minuti, 24 ore su 24.
    # GitHub Actions può ritardare di qualche minuto l'avvio del cron.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-trains
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna dati live
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python scripts/update_trains.py

          if git diff --quiet -- data/trains.json; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git add data/trains.json
          git commit -m "Aggiorna dati live treni"

          # Se nel frattempo il repository è cambiato (es. aggiornamento PWA),
          # integra prima le modifiche remote invece di far fallire il push.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push non riuscito, ritento tra 10 secondi ($attempt/3)..."
            sleep 10
          done

          echo "Impossibile pubblicare l'aggiornamento dopo 3 tentativi."
          exit 1
