name: Patch Train UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-train-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 scripts/patch_index_once.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply iOS 27 Train UI and fix stale return status"
          git push
